[workspace]
resolver = "3"
members = [
    "crates/backhopper-core",
    "crates/backhopper-cache",
    "crates/backhopper-git",
    "crates/backhopper-erlang",
    "crates/backhopper-erlang-scan",
    "crates/backhopper-elixir",
    "crates/backhopper-cuttlefish",
    "crates/backhopper-xref-graph",
    "crates/backhopper-xref-reader",
    "crates/backhopper-xref",
    "crates/backhopper-cli",
    "crates/backhopper-driver",
    "crates/backhopper-test-support",
    "crates/xtask",
]

[workspace.package]
version = "0.22.0"
edition = "2024"
rust-version = "1.95"
authors = ["Michael S. Klishin and Contributors"]
license = "MIT OR Apache-2.0"
repository = "https://github.com/michaelklishin/backhopper"
homepage = "https://github.com/michaelklishin/backhopper"
readme = "README.md"

[workspace.dependencies]
backhopper-core        = { path = "crates/backhopper-core",        version = "0.22.0" }
backhopper-cache       = { path = "crates/backhopper-cache",       version = "0.22.0" }
backhopper-git         = { path = "crates/backhopper-git",         version = "0.22.0" }
backhopper-erlang      = { path = "crates/backhopper-erlang",      version = "0.22.0" }
backhopper-erlang-scan = { path = "crates/backhopper-erlang-scan", version = "0.22.0" }
backhopper-elixir      = { path = "crates/backhopper-elixir",      version = "0.22.0" }
backhopper-cuttlefish  = { path = "crates/backhopper-cuttlefish",  version = "0.22.0" }
backhopper-xref-graph  = { path = "crates/backhopper-xref-graph",  version = "0.22.0" }
backhopper-xref-reader = { path = "crates/backhopper-xref-reader", version = "0.22.0" }
backhopper-xref        = { path = "crates/backhopper-xref",        version = "0.22.0" }
backhopper-driver      = { path = "crates/backhopper-driver",      version = "0.22.0" }

anyhow             = "1.0.102"
bel7-cli           = { version = "0.13.0", features = ["tables", "clap", "completions", "progress", "errors", "serde"] }
blake3             = "1.8.5"
clap               = { version = "4.6.1", features = ["cargo", "derive", "env", "wrap_help"] }
gix                = { version = "=0.85.0" }
imara-diff         = "0.2.0"
proptest           = "1.11.0"
regex              = "1.12.3"
schemars           = { version = "1.2", default-features = false, features = ["std"] }
serde              = { version = "1.0.228", features = ["derive"] }
serde_json         = "1.0.150"
tabled             = "0.21.0"
tempfile           = "3.27.0"
thiserror          = "2.0.18"
time               = { version = "0.3.47", features = ["formatting", "parsing", "macros", "serde"] }
toml               = "1.1.2"
toml_edit          = "0.25.12"
tracing            = "0.1.44"
tracing-subscriber = { version = "0.3.23", features = ["env-filter", "fmt"] }

assert_cmd         = "2.2.2"
predicates         = "3.1.4"

[workspace.lints.rust]
unsafe_code        = "deny"
unreachable_pub    = "warn"
missing_debug_implementations = "warn"

[workspace.lints.clippy]
pedantic                = { level = "warn", priority = -1 }
uninlined_format_args   = "allow"
module_name_repetitions = "allow"
must_use_candidate      = "allow"
missing_errors_doc      = "allow"
missing_panics_doc      = "allow"
needless_pass_by_value  = "allow"
return_self_not_must_use = "allow"
similar_names           = "allow"
case_sensitive_file_extension_comparisons = "allow"
manual_let_else         = "allow"
match_same_arms         = "allow"
single_match_else       = "allow"
single_char_pattern     = "allow"
collapsible_if          = "allow"
collapsible_match       = "allow"
needless_continue       = "allow"
struct_field_names      = "allow"
manual_strip            = "allow"
map_unwrap_or           = "allow"
while_let_loop          = "allow"
cast_sign_loss          = "allow"
cast_possible_truncation = "allow"
cast_possible_wrap      = "allow"
cast_precision_loss     = "allow"
unreadable_literal      = "allow"
too_many_lines          = "allow"
doc_markdown            = "allow"
doc_lazy_continuation   = "allow"
format_push_string      = "allow"
bool_to_int_with_if     = "allow"
manual_pattern_char_comparison = "allow"
unnecessary_wraps       = "allow"
unnested_or_patterns    = "allow"
if_same_then_else       = "allow"
manual_map              = "allow"
redundant_closure_for_method_calls = "allow"
unused_self             = "allow"
enum_glob_use           = "allow"
needless_raw_string_hashes = "allow"
struct_excessive_bools  = "allow"
semicolon_if_nothing_returned = "allow"
result_large_err        = "allow"
items_after_statements  = "allow"
explicit_iter_loop      = "allow"
explicit_into_iter_loop = "allow"
inefficient_to_string   = "allow"
unnecessary_debug_formatting = "allow"
mut_mut                 = "allow"
needless_collect        = "allow"
ptr_arg                 = "allow"
suboptimal_flops        = "allow"
should_panic_without_expect = "allow"
default_trait_access    = "allow"
unused_async            = "allow"
ignored_unit_patterns   = "allow"
mismatching_type_param_order = "allow"
duration_subsec         = "allow"

[profile.release]
lto             = "thin"
codegen-units   = 1
strip           = true
opt-level       = 3

[profile.ci]
inherits  = "release"
opt-level = "s"

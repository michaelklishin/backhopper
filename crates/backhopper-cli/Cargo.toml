[package]
name        = "backhopper-cli"
version     = { workspace = true }
edition     = { workspace = true }
rust-version = { workspace = true }
authors     = { workspace = true }
license     = { workspace = true }
repository  = { workspace = true }
description = "Command-line interface for backhopper"

[[bin]]
name = "backhopper"
path = "src/main.rs"

[lints]
workspace = true

[dependencies]
backhopper-cache       = { workspace = true }
backhopper-core        = { workspace = true, features = ["schemars"] }
backhopper-git         = { workspace = true }
backhopper-driver      = { workspace = true, features = ["schemars"] }
backhopper-erlang      = { workspace = true }
backhopper-elixir      = { workspace = true }
backhopper-xref        = { workspace = true }
backhopper-xref-reader = { workspace = true }

anyhow                 = { workspace = true }
bel7-cli               = { workspace = true }
clap                   = { workspace = true }
regex                  = { workspace = true }
schemars               = { workspace = true, features = ["derive"] }
serde                  = { workspace = true }
serde_json             = { workspace = true }
tabled                 = { workspace = true }
thiserror              = { workspace = true }
time                   = { workspace = true }
toml                   = { workspace = true }
toml_edit              = { workspace = true }
tracing                = { workspace = true }
tracing-subscriber     = { workspace = true }

[dev-dependencies]
assert_cmd = { workspace = true }
insta      = { workspace = true }
predicates = { workspace = true }
proptest   = { workspace = true }
tempfile   = { workspace = true }

[[test]]
name = "unit"
path = "tests/unit/main.rs"

[[test]]
name = "integration"
path = "tests/integration/main.rs"

[[test]]
name = "proptests"
path = "tests/proptests/main.rs"

[[test]]
name = "online"
path = "tests/online/main.rs"

[package]
name        = "backhopper-cli"
version     = { workspace = true }
edition     = { workspace = true }
rust-version = { workspace = true }
authors     = { workspace = true }
license     = { workspace = true }
repository  = { workspace = true }
description = "Command-line interface for backhopper"

[[bin]]
name = "backhopper"
path = "src/main.rs"

[lints]
workspace = true

[dependencies]
backhopper-core   = { workspace = true }
backhopper-erlang = { workspace = true }
backhopper-elixir = { workspace = true }

anyhow                 = { workspace = true }
clap                   = { workspace = true }
clap_complete          = { workspace = true }
clap_complete_nushell  = { workspace = true }
owo-colors             = { workspace = true }
serde                  = { workspace = true }
serde_json             = { workspace = true }
sysexits               = { workspace = true }
tabled                 = { workspace = true }
thiserror              = { workspace = true }
time                   = { workspace = true }
tracing                = { workspace = true }
tracing-subscriber     = { workspace = true }

[dev-dependencies]
assert_cmd = { workspace = true }
insta      = { workspace = true }
predicates = { workspace = true }
proptest   = { workspace = true }
tempfile   = { workspace = true }

[[test]]
name = "unit"
path = "tests/unit/main.rs"

[[test]]
name = "integration"
path = "tests/integration/main.rs"

[[test]]
name = "proptests"
path = "tests/proptests/main.rs"

[[test]]
name = "online"
path = "tests/online/main.rs"

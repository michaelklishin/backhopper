[package]
name        = "backhopper-jigsaw"
version     = { workspace = true }
edition     = { workspace = true }
rust-version = { workspace = true }
authors     = { workspace = true }
license     = { workspace = true }
repository  = { workspace = true }
description = "Reads an Erlang plugin set into the references backhopper's jigsaw check compares"

[lib]
test = false

[lints]
workspace = true

[dependencies]
backhopper-core        = { workspace = true }
backhopper-cuttlefish  = { workspace = true }
backhopper-erlang      = { workspace = true }
backhopper-erlang-scan = { workspace = true }
backhopper-xref-graph  = { workspace = true }
backhopper-xref-reader = { workspace = true }
regex                  = { workspace = true }
thiserror              = { workspace = true }

[dev-dependencies]
backhopper-test-support = { path = "../backhopper-test-support" }
proptest                = { workspace = true }
tempfile                = { workspace = true }

[[test]]
name = "unit"
path = "tests/unit/main.rs"

[[test]]
name = "proptests"
path = "tests/proptests/main.rs"

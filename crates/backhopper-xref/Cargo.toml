[package]
name        = "backhopper-xref"
version     = { workspace = true }
edition     = { workspace = true }
rust-version = { workspace = true }
authors     = { workspace = true }
license     = { workspace = true }
repository  = { workspace = true }
description = "Whole-program cross-reference analysis for Erlang projects: undefined-call detection, dead-export detection, reverse traversal, behaviour conformance, cross-tag diff"

[lints]
workspace = true

[dependencies]
backhopper-core        = { workspace = true }
backhopper-xref-graph  = { workspace = true }
backhopper-xref-reader = { workspace = true }
serde                  = { workspace = true }
thiserror              = { workspace = true }

[dev-dependencies]
proptest = { workspace = true }
tempfile = { workspace = true }

[[test]]
name = "unit"
path = "tests/unit/main.rs"

[[test]]
name = "integration"
path = "tests/integration/main.rs"

[[test]]
name = "proptests"
path = "tests/proptests/main.rs"
